name: Build Windows executable
on:
  repository_dispatch:
    types: [py2exe-build]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
          cache: "pip"
          cache-dependency-path: .github/requirements-build.txt
      - name: Create isolated build environment
        run: |
          python -m venv .build-venv
          .build-venv\Scripts\python.exe -m pip install --disable-pip-version-check --no-warn-script-location -r .github/requirements-build.txt
      - name: Download project and build
        env:
          JOB_ID: ${{ github.event.client_payload.job_id }}
          JOB_TOKEN: ${{ github.event.client_payload.job_token }}
          WORKER_URL: ${{ github.event.client_payload.worker_url }}
        run: .build-venv\Scripts\python.exe .github/scripts/build_job.py
