name: Build Windows executable
on:
  repository_dispatch:
    types: [py2exe-build]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11.9"
      - name: Create isolated build environment
        run: |
          python -m venv .build-venv
          .build-venv\Scripts\python.exe -m pip install --disable-pip-version-check --no-warn-script-location -r .github/requirements-build.txt
      - name: Set up Rust toolchain
        shell: pwsh
        run: |
          $installer = "$env:TEMP\rustup-init.exe"
          Invoke-WebRequest -Uri "https://win.rustup.rs/x86_64" -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList "-y --profile minimal --default-toolchain stable --default-host x86_64-pc-windows-msvc" -Wait -NoNewWindow
          Remove-Item $installer -Force -ErrorAction SilentlyContinue
          "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Download project and build
        env:
          JOB_ID: ${{ github.event.client_payload.job_id }}
          JOB_TOKEN: ${{ github.event.client_payload.job_token }}
          WORKER_URL: ${{ github.event.client_payload.worker_url }}
        run: .build-venv\Scripts\python.exe .github/scripts/build_job.py
