name: Build Windows executable
on:
  repository_dispatch:
    types: [py2exe-build]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller==6.13.0
      - name: Download project and build
        env:
          JOB_ID: ${{ github.event.client_payload.job_id }}
          JOB_TOKEN: ${{ github.event.client_payload.job_token }}
          WORKER_URL: ${{ github.event.client_payload.worker_url }}
        run: python .github/scripts/build_job.py
